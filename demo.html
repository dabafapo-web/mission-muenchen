</script><script>(()=>{'use strict';const E=QuizEngine,D=QuizData,M=CityMap,main=document.querySelector('main');let stage=0,index=0,results=[],answers=[],locked=false,chosen=[],rowOrder=[],shownHints=0;let saved={},remember=false;try{remember=localStorage.getItem('mm-optin')==='yes';if(remember)saved=JSON.parse(localStorage.getItem('mm-scores')||'{}')}catch{}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function home(){main.innerHTML=`<section class="hero"><p class="eyebrow">MÜNCHEN MAL ANDERS</p><h1>Eine Stadt.<br>Vier Missionen.</h1><p class="intro" lang="fr">Révise ton allemand, explore Munich et change de regard. Quatre étapes autonomes, sans chronomètre.</p><div class="hero-meta"><span>${D.reduce((n,s)=>n+s.tasks.length,0)} tâches</span><span>4 étapes</span><span>À ton rythme</span></div><div class="skyline" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div></section><section aria-label="Étapes" class="stages"></section><section class="privacy" lang="fr"><label><input type="checkbox" id="remember" ${remember?'checked':''}> Conserver mes scores sur cet appareil</label><p>Facultatif : seuls les derniers scores sont enregistrés dans ce navigateur. Les réponses et les scores ne sont pas transmis.</p><button id="erase" class="quiet">Effacer les scores</button><p>Les étapes 2 et 3 révisent les documents étudiés en classe.</p></section>`;const grid=main.querySelector('.stages');D.forEach((s,i)=>{let card=document.createElement('article');card.className='stage-card';card.innerHTML=`<span class="stage-icon" aria-hidden="true">${s.icon}</span><p class="eyebrow">ETAPPE ${i+1} · ${s.tasks.length} AUFGABEN</p><h2>${s.title}</h2><p lang="fr">${s.subtitle}</p><p class="last" lang="fr">${saved[i]===undefined?'Prêt pour cette mission ?':`Dernier score : ${saved[i]} / ${s.tasks.length}`}</p>`;card.append(button(saved[i]===undefined?'Starten →':'Neu starten →',()=>start(i),'primary'));grid.append(card)});document.querySelector('#remember').onchange=e=>{remember=e.target.checked;if(remember)persist();else try{localStorage.removeItem('mm-optin');localStorage.removeItem('mm-scores')}catch{}};document.querySelector('#erase').onclick=()=>{saved={};persist();home();focus()};focus()}
function start(i){stage=i;index=0;results=[];render()}
function select(options,id,label){return `<select id="${id}" aria-label="${esc(label)}"><option value="">— wählen —</option>${E.shuffle(options).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`}
function render(){locked=false;chosen=[];answers=[];shownHints=0;const t=D[stage].tasks[index];main.innerHTML=`<nav class="quiz-nav" lang="fr"><button id="home" class="quiet">← Retour aux étapes</button><span>Étape ${stage+1} / ${D.length}</span></nav><div class="progress-label"><span>${esc(D[stage].title)}</span><span>${index+1} / ${D[stage].tasks.length}</span></div><progress value="${index}" max="${D[stage].tasks.length}" aria-label="Tâches terminées"></progress><article class="question"><p class="eyebrow">AUFGABE ${taskNumber(index)}</p><h1>${esc(t.prompt)}</h1><div id="task"></div><div id="hints"></div><div class="actions"><button id="validate" class="primary" lang="fr">Valider</button></div><div id="feedback" lang="fr" role="status" aria-live="polite"></div></article>`;document.querySelector('#home').onclick=home;const area=document.querySelector('#task');if(t.map){let container=document.createElement('div');container.className='map';container.innerHTML=M.svg(t.map);area.append(container);let caption=document.createElement('p');caption.className='map-caption';caption.lang='fr';caption.textContent='Plan fictif · La flèche sombre indique le départ et le sens de marche.';area.append(caption)}

if(t.type==='order'){let result=document.createElement('div');result.className='sentence';result.innerHTML=`<span>${esc(t.prefix)}</span><div id="ordered"></div>`;area.append(result);let bank=document.createElement('div');bank.className='blocks';let mixed=E.shuffle(t.blocks.map((_,i)=>i));if(mixed.every((v,i)=>v===i)&&mixed.length>1)mixed.push(mixed.shift());mixed.forEach(i=>{let b=button(t.blocks[i],()=>{if(locked)return;chosen.push(i);b.disabled=true;updateOrder()});b.dataset.block=i;bank.append(b)});area.append(bank);let help=document.createElement('p');help.lang='fr';help.className='subtle';help.textContent='Clique sur les blocs dans l’ordre. Clique sur un bloc placé pour le retirer.';area.append(help);function updateOrder(){const target=document.querySelector('#ordered');target.innerHTML='';chosen.forEach((v,pos)=>target.append(button(t.blocks[v]+' ×',()=>{if(locked)return;chosen.splice(pos,1);bank.querySelector(`[data-block="${v}"]`).disabled=false;updateOrder()})))}area.append(button('Tout retirer',()=>{chosen=[];bank.querySelectorAll('button').forEach(b=>b.disabled=false);updateOrder()},'quiet'))}

document.querySelector('#validate').onclick=validate;focus()}
function readAnswer(t){if(t.type==='text')return document.querySelector('#text-answer').value.trim();if(t.type==='choice')return document.querySelector('input[name="choice"]:checked')?.value||'';if(t.type==='map')return chosen[0]||'';if(t.type==='order')return chosen.map(i=>t.blocks[i]);if(t.type==='match'||t.type==='classify')return t.answer.map((_,i)=>document.querySelector('#row'+i).value);return t.answer.map((_,i)=>document.querySelector('#blank'+i).value)}
function expected(t){if(t.type==='map')return M.buildings.find(b=>b.id===t.answer).name;if(t.type==='order')return [t.prefix,...t.answer].filter(Boolean).join(' ')+'.';if(t.type==='fill')return t.parts.map(p=>p.replace(/\{(\d+)\}/g,(_,n)=>t.answer[n])).join(' ');if(t.type==='match')return t.pairs.map(p=>p.join(' → ')).join(' ; ');if(t.type==='classify')return t.items.map((x,i)=>x+' → '+t.answer[i]).join(' ; ');return t.answer}
function validate(){if(locked)return;let t=D[stage].tasks[index],a=readAnswer(t);const full=Array.isArray(a)?a.length===t.answer.length&&a.every(Boolean):!!a;let fb=document.querySelector('#feedback');if(!full){fb.innerHTML='<p>Complète toutes les réponses avant de valider.</p>';return}locked=true;let ok=E.correct(t,a);results.push(ok);document.querySelector('progress').value=results.length;document.querySelector('#task').querySelectorAll('button,input,select').forEach(e=>e.disabled=true);document.querySelectorAll('[data-building]').forEach(g=>g.setAttribute('aria-disabled','true'));document.querySelector('#validate').disabled=true;fb.className=ok?'feedback success':'feedback retry';fb.innerHTML=`<h2>${ok?'Richtig — bien joué !':'Noch nicht — voici la correction.'}</h2>${ok?'':`<p><strong>Réponse attendue :</strong> ${esc(expected(t))}</p>`}<p>${esc(t.feedback)}</p><p>Continue pour t’entraîner.</p>`;let next=button(index===D[stage].tasks.length-1?'Voir mon score':'Continuer →',()=>{if(index===D[stage].tasks.length-1)finish();else{index++;render()}},'primary');next.lang='fr';fb.append(next);next.focus()}
